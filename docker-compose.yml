services:
  jupyter:
    build:
      context: .
      dockerfile: docker/jupyter/Dockerfile
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:?Impostare JUPYTER_TOKEN in .env}
      POSTGRES_DB: ${POSTGRES_DB:-tlc}
      POSTGRES_USER: ${POSTGRES_USER:-tlc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Impostare POSTGRES_PASSWORD in .env}
      SPARK_MASTER: ${SPARK_MASTER:-local[4]}
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-3g}
      SPARK_SHUFFLE_PARTITIONS: ${SPARK_SHUFFLE_PARTITIONS:-12}
    ports:
      - "127.0.0.1:${JUPYTER_PORT:-8888}:8888"
    volumes:
      - ./data/raw:/workspace/data/raw:ro
      - ./notebooks:/workspace/notebooks
      - ./src:/workspace/src:ro
      - ./tests:/workspace/tests:ro
      - ./results:/workspace/results
    depends_on:
      hdfs:
        condition: service_healthy
      postgres:
        condition: service_healthy

  hdfs:
    build:
      context: .
      dockerfile: docker/hdfs/Dockerfile
    volumes:
      - hdfs-data:/var/lib/hdfs
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/hdfs-ready && hdfs dfsadmin -report -live | grep -F 'Live datanodes (1)'"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 20s

  postgres:
    image: postgres:16.8-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tlc}
      POSTGRES_USER: ${POSTGRES_USER:-tlc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Impostare POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  hdfs-data:
  postgres-data:
